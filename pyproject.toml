[project]
name = "rgscore"
dynamic = ["version"]
description = "Python API for describing and accessing hardware registers"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "bitstring >= 5.0.0, < 6.0.0",
    "i2c-api",
    "pydantic>=2.14.1",
]

[build-system]
requires = ["setuptools", "wheel", "setuptools-git-versioning"]
build-backend = "setuptools.build_meta"

[tool.setuptools-git-versioning]
enabled = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "F", # Pyflakes
    "E", # pycodestyle
    "W", # pycodestyle
    "B", # flake8-bugbear
    "I", # isort
]

[tool.uv.sources]
i2c-api = { git = "https://github.com/priimak/i2c_api.git", rev = "v0.19.2" }
i2c-drivers = { git = "https://github.com/Brainless-Software/i2c_drivers.git", rev = "v0.1.1" }

[dependency-groups]
dev = [
    "i2c-drivers",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff",
]
