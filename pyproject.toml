[project]
name = "rgscore"
dynamic = ["version"]
description = "Python API for describing and accessing hardware registers"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "bitstring >= 5.0.0, < 6.0.0",
    "i2c-api>=0.20.0",
    "pydantic>=2.14.1",
]

[build-system]
requires = ["setuptools", "wheel", "setuptools-git-versioning"]
build-backend = "setuptools.build_meta"

[tool.setuptools-git-versioning]
enabled = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "F", # Pyflakes
    "E", # pycodestyle
    "W", # pycodestyle
    "B", # flake8-bugbear
    "I", # isort
]

[dependency-groups]
dev = [
    "i2c-drivers>=0.1.4",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff",
]

[tool.pytest]
minversion = "9.0"
addopts = ["--cov=src", "--cov-report=json", "-ra", "-q", "--strict-markers", "--ignore=tests/test_integration_bmp581.py"]
testpaths = ["tests"]
