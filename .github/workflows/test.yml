name: Unit Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up uv
      uses: astral-sh/setup-uv@v5
      with:
        # Enable automatic caching of uv dependencies
        enable-cache: true
        # Optimizes cache hits based on your lock file
        cache-dependency-glob: "uv.lock"

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        # uv will automatically use this Python version
        python-version-file: "pyproject.toml"

    - name: Install dependencies
      # --frozen ensures uv fails if uv.lock is out of sync with pyproject.toml
      run: uv sync --frozen

    - name: Run tests
      run: uv run pytest

